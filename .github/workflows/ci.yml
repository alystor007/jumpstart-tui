name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install lint deps
        run: pip install ruff

      - name: Byte-compile all scripts
        run: python -m py_compile jumpstart_tui.py run_command.py

      - name: Lint
        run: ruff check .

      - name: Run test suite
        run: python test_jumpstart.py
